steps:
  - name: version
    image: alpine
    commands:
      - apk add --no-cache git make jq
      - make ci-version

  - name: build
    image: golang:1.26.3-alpine
    commands:
      - apk add --no-cache zip make curl git
      # The go.mod may point at a local ../pncdsl checkout (see README);
      # in CI clone the framework next to the workspace so it resolves.
      - if grep -q '=> \.\./pncdsl' go.mod; then git clone https://git.teletypegames.org/games/pncdsl ../pncdsl; fi
      - make ci-export

  - name: artifact
    image: alpine
    environment:
      DROPAREA_HOST: vps.teletype.hu
      DROPAREA_PORT: 2223
      DROPAREA_TARGET_PATH: /home/drop
      DROPAREA_USER: drop
      DROPAREA_SSH_PASSWORD:
        from_secret: droparea_ssh_password
    commands:
      - apk add --no-cache make openssh-client sshpass
      - make ci-upload

  - name: update
    image: alpine
    environment:
      UPDATE_SERVER: https://teletypegames.org
      UPDATE_SECRET:
        from_secret: update_secret_key
    commands:
      - apk add --no-cache make curl
      - make ci-update
